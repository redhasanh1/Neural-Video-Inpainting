<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MarkRemoverAI</title>
    <link rel="canonical" href="https://markremoverai.com/reset-password">
    <meta name="description" content="Reset your MarkRemoverAI password. Enter your email to receive a secure password reset link.">
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5993103018552371"
     crossorigin="anonymous"></script>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: rgba(248, 250, 252, 0.85);
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --border-color: rgba(102, 126, 234, 0.12);
        }

        html[data-theme="dark"] {
            --bg-primary: #0b1020;
            --bg-secondary: #121826;
            --bg-card: rgba(26, 26, 46, 0.85);
            --text-primary: #e5e7eb;
            --text-secondary: #9aa4b2;
            --border-color: rgba(102, 126, 234, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 450px;
            width: 100%;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s ease;
        }

        html[data-theme="dark"] .card {
            box-shadow: 0 20px 60px rgba(15, 15, 30, 0.45);
        }

        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container img {
            width: 72px;
            height: 72px;
            margin-bottom: 1rem;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: 1.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.6;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        input {
            width: 100%;
            padding: 0.95rem 1rem;
            border: 2px solid rgba(102, 126, 234, 0.25);
            border-radius: 12px;
            font-size: 1rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .btn {
            width: 100%;
            padding: 0.95rem 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.35);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .alert-success {
            background: rgba(72, 187, 120, 0.15);
            color: #48bb78;
            border: 2px solid rgba(72, 187, 120, 0.3);
        }

        .alert-error {
            background: rgba(245, 101, 101, 0.15);
            color: #f56565;
            border: 2px solid rgba(245, 101, 101, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: none;
            background: var(--gradient-primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        #resetSection {
            display: none;
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle">Dark</button>

    <div class="container">
        <div class="card">
            <div class="logo-container">
                <img src="logo.svg" alt="MarkRemoverAI">
            </div>

            <div id="globalMessage" class="alert" style="display: none;"></div>

            <!-- Request Reset Section -->
            <div id="requestSection">
                <h1>Reset Your Password</h1>
                <p>Enter your email address and we'll send you a link to reset your password.</p>
                <p style="font-size: 0.8rem; margin-top: -0.5rem;">If you don't receive it, check your spam or junk folder.</p>

                <form id="requestResetForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                    <button type="submit" class="btn">Send Reset Link</button>
                </form>

                <a href="login" class="back-link">Back to Sign In</a>
            </div>

            <!-- Reset Password Section (shown when token is present) -->
            <div id="resetSection">
                <h1>Create New Password</h1>
                <p>Enter your new password below.</p>

                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" autocomplete="new-password" required minlength="8">
                        <small style="color: var(--text-secondary); font-size: 0.85rem;">Minimum 8 characters</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" required minlength="8">
                    </div>
                    <button type="submit" class="btn">Reset Password</button>
                </form>

                <a href="login" class="back-link">Back to Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script>
        (function() {
            const API_BASE = window.API_BASE_URL || '';

            // Check if we have a reset token in the URL
            const urlParams = new URLSearchParams(window.location.search);
            const resetToken = urlParams.get('token');

            if (resetToken) {
                // Show reset password form
                document.getElementById('requestSection').style.display = 'none';
                document.getElementById('resetSection').style.display = 'block';
            }

            function showMessage(message, type = 'success') {
                const messageEl = document.getElementById('globalMessage');
                messageEl.textContent = message;
                messageEl.className = `alert alert-${type}`;
                messageEl.style.display = 'block';
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 5000);
            }

            // Request password reset
            document.getElementById('requestResetForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const submitBtn = e.target.querySelector('button[type="submit"]');

                console.log('[DEBUG] === FORGOT PASSWORD REQUEST ===');
                console.log('[DEBUG] Email:', email);
                console.log('[DEBUG] API_BASE:', API_BASE);
                console.log('[DEBUG] Full URL:', `${API_BASE}/api/auth/forgot-password`);

                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';

                try {
                    console.log('[DEBUG] Sending fetch request...');
                    const response = await fetch(`${API_BASE}/api/auth/forgot-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email })
                    });

                    console.log('[DEBUG] Response status:', response.status);
                    console.log('[DEBUG] Response ok:', response.ok);

                    const data = await response.json();
                    console.log('[DEBUG] Response data:', data);

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to send reset email');
                    }

                    console.log('[DEBUG] SUCCESS! Email should be sent');
                    showMessage('Password reset link sent! Check your email.', 'success');
                    document.getElementById('requestResetForm').reset();
                } catch (error) {
                    console.error('[DEBUG] ERROR:', error);
                    console.error('[DEBUG] Error message:', error.message);
                    showMessage(error.message, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            });

            // Reset password with token
            document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const submitBtn = e.target.querySelector('button[type="submit"]');

                if (newPassword !== confirmPassword) {
                    showMessage('Passwords do not match', 'error');
                    return;
                }

                if (newPassword.length < 8) {
                    showMessage('Password must be at least 8 characters', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Resetting...';

                try {
                    const response = await fetch(`${API_BASE}/api/auth/reset-password`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: resetToken,
                            newPassword
                        })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Failed to reset password');
                    }

                    showMessage('Password reset successfully! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login';
                    }, 2000);
                } catch (error) {
                    console.error('Reset password error:', error);
                    showMessage(error.message, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            });
        })();
    </script>
</body>
</html>
